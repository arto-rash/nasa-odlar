# Local full stack: PostGIS + analytics (FastAPI) + gateway (Laravel).
#   docker compose up --build        → http://localhost:8000/api/v1/status
# The web app runs separately (pnpm dev in ./web, or Vercel).
name: odlar

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: odlar
      POSTGRES_USER: odlar
      POSTGRES_PASSWORD: odlar
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odlar -d odlar"]
      interval: 5s
      retries: 20

  ml:
    build: ./ml
    environment:
      ODLAR_INTERNAL_TOKEN: ${ODLAR_INTERNAL_TOKEN:-local-dev-token}
    volumes: ["./ml/artifacts:/app/artifacts:ro"]
    ports: ["8001:8001"]

  api:
    build: ./api
    depends_on:
      db: { condition: service_healthy }
      ml: { condition: service_started }
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:fL68Z0imICf1vw7xQN6B67tgEJ+Zv67UpO8i7jMZQRQ=}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: odlar
      DB_USERNAME: odlar
      DB_PASSWORD: odlar
      ODLAR_ML_URL: http://ml:8001
      ODLAR_INTERNAL_TOKEN: ${ODLAR_INTERNAL_TOKEN:-local-dev-token}
      FRONTEND_URLS: http://localhost:3000
      MAIL_MAILER: log
      SEED_DEMO: "true"
    ports: ["8000:8080"]

volumes:
  pgdata:
