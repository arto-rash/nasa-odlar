name: CI
on: [push, pull_request]

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e .
      - run: ruff check odlar tests
      - run: python -m pytest --cov=odlar.harmonize --cov=odlar.calendar --cov=odlar.model --cov-fail-under=85

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgis:
        image: postgis/postgis:16-3.4-alpine
        env: { POSTGRES_USER: odlar, POSTGRES_PASSWORD: odlar, POSTGRES_DB: odlar_test }
        ports: ["5436:5432"]
        options: --health-cmd "pg_isready -U odlar" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_pgsql, intl, zip" }
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
