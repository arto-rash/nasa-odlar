; Production PHP overrides for the ODLAR API (small shared VM).
memory_limit = 256M
max_execution_time = 90
upload_max_filesize = 2M
post_max_size = 2M
expose_php = Off

; PHP2Shell (CVE-2026-109619) mitigation, kept on top of the patched build.
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
; Code is immutable inside the image.
opcache.validate_timestamps = 0
