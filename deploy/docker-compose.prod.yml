# Production stack on the shared box. Nothing is published to the host: the API
# joins the existing Caddy's network as `odlar-api`; ml and db stay internal.
#   cd /opt/odlar/deploy && docker compose -f docker-compose.prod.yml up -d --build
name: odlar

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    mem_limit: 256m

  ml:
    build: ../ml
    image: odlar-ml:latest
    restart: unless-stopped
    environment:
      ODLAR_INTERNAL_TOKEN: ${ODLAR_INTERNAL_TOKEN}
    volumes: ["/opt/odlar/artifacts:/app/artifacts:ro"]
    mem_limit: 1400m  # the region sync after each new batch peaks above 1.1 GB
    # a guest on Jabish's server: under memory pressure ODLAR goes first
    oom_score_adj: 500

  # Daily data refresh (deploy/refresh.sh, run from cron). Not started by `up`.
  refresh:
    image: odlar-ml:latest
    profiles: [jobs]
    user: "0:0"
    environment:
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
    volumes: ["/opt/odlar/artifacts:/app/artifacts"]
    command: ["python", "-m", "odlar.refresh"]
    mem_limit: 2000m  # big batches passed 1.7 GB in Nov 2026; killed first if the box runs short
    oom_score_adj: 800

  api:
    build: ../api
    image: odlar-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      ODLAR_ML_URL: http://ml:8001
    depends_on:
      db: { condition: service_healthy }
      ml: { condition: service_started }
    networks:
      default:
      proxy:
        aliases: [odlar-api]
    mem_limit: 768m  # the region sync of the biggest countries; idles near 70 MB
    oom_score_adj: 500

networks:
  proxy:
    external: true
    name: portfelim_default

volumes:
  pgdata:
