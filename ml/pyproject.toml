[project]
name = "odlar"
version = "1.0.0"
description = "ODLAR — harmonized MODIS/VIIRS fire calendar and risk engine"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "lightgbm>=4.5",
  "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "pyarrow>=16",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "respx>=0.21", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["odlar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end pipeline tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.Header", "pandas.Timestamp"]
